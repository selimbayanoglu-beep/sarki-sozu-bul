name: sarki-sozu-bul
services:
  sarki-sozu-bul:
    image: python:3.11-slim
    container_name: sarki-sozu-bul
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: "8891"
      HTTPS_PORT: "8892"
      PYTHONUNBUFFERED: "1"
    ports:
      - target: 8891
        published: "8891"
        protocol: tcp
      - target: 8892
        published: "8892"
        protocol: tcp
    command:
      - python3
      - -c
      - "import io,os,ssl,sys,urllib.request,zipfile; os.makedirs('/app',exist_ok=True); ctx=ssl._create_unverified_context(); z=zipfile.ZipFile(io.BytesIO(urllib.request.urlopen('https://codeload.github.com/selimbayanoglu-beep/sarki-sozu-bul/zip/refs/heads/main',context=ctx,timeout=25).read())); [open('/app/'+os.path.basename(m),'wb').write(z.read(m)) for m in z.namelist() if not m.endswith('/') and m.count('/')==1 and not (os.path.basename(m)=='history.json' and os.path.exists('/app/history.json'))]; os.execv(sys.executable,[sys.executable,'/app/server.py','--port','8891','--https-port','8892','--no-browser'])"
x-casaos:
  architectures:
    - amd64
    - arm64
  main: sarki-sozu-bul
  author: Selim
  category: Music
  description:
    en_us: 4-Layer Music & Live Vocal Recognition to Synced Karaoke Lyrics
    tr_tr: 4 Katmanlı Müzik ve Vokal Tanıma ile Canlı Senkronize Şarkı Sözü Bulucu
  hostname: 159.195.255.168
  icon: https://raw.githubusercontent.com/selimbayanoglu-beep/sarki-sozu-bul/main/icon.svg
  index: /
  port_map: "8891"
  scheme: http
  title:
    en_us: Sarki Sozu Bul
    tr_tr: Şarkı Sözü Bul
