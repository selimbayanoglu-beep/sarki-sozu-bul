name: sarki-sozu-bul
services:
  sarki-sozu-bul:
    image: python:3.11-slim
    container_name: sarki-sozu-bul
    restart: unless-stopped
    ports:
      - "8891:8891"
    command:
      - sh
      - -c
      - |
        apt-get update && apt-get install -y ffmpeg git curl &&
        ARCH=$$(dpkg --print-architecture) &&
        curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$${ARCH}" -o /usr/local/bin/cloudflared &&
        chmod +x /usr/local/bin/cloudflared || true &&
        mkdir -p /app && cd /app &&
        if [ -d .git ]; then
          git fetch origin && git reset --hard origin/main;
        else
          git clone https://github.com/selimbayanoglu-beep/sarki-sozu-bul.git .;
        fi &&
        pip install --no-cache-dir -r requirements.txt &&
        python3 server.py --port 8891 --no-browser
x-casaos:
  main: sarki-sozu-bul
  title:
    tr_tr: Şarkı Sözü Bul
  port_map: "8891"
  index: /
