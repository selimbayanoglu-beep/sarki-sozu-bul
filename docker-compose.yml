name: sarki-sozu-bul
services:
  sarki-sozu-bul:
    image: python:3.11-slim
    container_name: sarki-sozu-bul
    restart: unless-stopped
    ports:
      - "8891:8891"
      - "8892:8892"
    command:
      - sh
      - -c
      - |
        which ffmpeg >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends ffmpeg git curl ca-certificates openssl) &&
        mkdir -p /app && cd /app &&
        rm -rf /tmp/sarki-repo &&
        git clone --depth 1 https://github.com/selimbayanoglu-beep/sarki-sozu-bul.git /tmp/sarki-repo &&
        cp -f /tmp/sarki-repo/*.py /tmp/sarki-repo/*.html /tmp/sarki-repo/*.css /tmp/sarki-repo/*.js /tmp/sarki-repo/*.json /tmp/sarki-repo/*.svg /tmp/sarki-repo/*.txt /tmp/sarki-repo/*.sh /app/ 2>/dev/null || true &&
        rm -rf /tmp/sarki-repo &&
        pip install -r /app/requirements.txt &&
        python3 /app/server.py --port 8891 --https-port 8892 --no-browser
x-casaos:
  main: sarki-sozu-bul
  title:
    tr_tr: Şarkı Sözü Bul
  port_map: "8891"
  index: /
